<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="100%" height="100%">
  <!-- Android Adaptive Icon (108x108 with 72x72 safe viewport) -->
  <defs>
    <!-- Background layer -->
    <linearGradient id="adaptive-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E232B"/>
      <stop offset="100%" stop-color="#0A0C0F"/>
    </linearGradient>
    <linearGradient id="adaptive-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="adaptive-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Full 108x108 canvas for Android parallax masking -->
  <rect width="108" height="108" fill="url(#adaptive-bg)"/>

  <!-- Foreground element scaled to fit inside 72x72 safe circle (center at 54, 54) -->
  <g transform="translate(54, 54) scale(0.14) translate(-256, -256)">
    <!-- Hexagonal Frame -->
    <path d="M 256 72 L 404 158 L 404 330 L 256 416 L 108 330 L 108 158 Z" 
          fill="none" 
          stroke="url(#adaptive-accent)" 
          stroke-width="22" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>

    <!-- P Loop -->
    <path d="M 180 180 L 320 180 C 354 180 372 200 372 232 C 372 264 354 284 320 284 L 236 284" 
          fill="none" 
          stroke="url(#adaptive-accent)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Vertical Stem -->
    <path d="M 236 150 L 236 360" 
          fill="none" 
          stroke="url(#adaptive-accent)" 
          stroke-width="26" 
          stroke-linecap="round"/>
    
    <!-- F Bar -->
    <path d="M 236 304 L 308 304" 
          fill="none" 
          stroke="url(#adaptive-cyan)" 
          stroke-width="26" 
          stroke-linecap="round"/>

    <!-- Spark -->
    <polygon points="340,344 356,360 340,376 324,360" fill="url(#adaptive-cyan)"/>
  </g>
</svg>
